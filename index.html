<!DOCTYPE html>  <html lang="id">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Portofolio Saya</title>  
    <style>  
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap');  :root {  
        --text-0: #ffffff;  
        --text-1: #cccccc;  
        --text-2: #999999;  
        --accent-1: #7c5cfc;  
        --accent-2: #00d4d4;  
        --accent-3: #ff6b9d;  
        --radius-xl: 20px;  
        --radius-lg: 16px;  
        --radius-md: 12px;  
        --font-sans: 'Inter', 'Segoe UI', sans-serif;  
        --font-display: 'Space Grotesk', 'Inter', sans-serif;  
        --line: rgba(255, 255, 255, 0.12);  
    }  

    * {  
        margin: 0;  
        padding: 0;  
        box-sizing: border-box;  
    }  

    html {  
        scroll-behavior: smooth;  
    }  

    body {  
        font-family: var(--font-sans);  
        background: transparent;  
        color: var(--text-0);  
        min-height: 100vh;  
        overflow-x: hidden;  
        line-height: 1.7;  
        -webkit-font-smoothing: antialiased;  
        -moz-osx-font-smoothing: grayscale;  
    }  

    .container {  
        position: relative;  
        z-index: 1;  
        max-width: 1120px;  
        margin: 0 auto;  
        padding: 1.5rem 1.5rem 3rem;  
        display: flex;  
        flex-direction: column;  
        align-items: center;  
    }  

    .hero {  
        display: flex;  
        flex-direction: column;  
        align-items: center;  
        text-align: center;  
        width: 100%;  
        animation: fadeInUp 0.8s ease-out;  
    }  
    @keyframes fadeInUp {  
        from { opacity: 0; transform: translateY(50px); }  
        to   { opacity: 1; transform: translateY(0); }  
    }  

    .hero-banner {  
        width: 100%;  
        height: auto;  
        display: block;  
        border-radius: 0 0 var(--radius-xl) var(--radius-xl);  
        margin-bottom: -90px;  
        box-shadow: 0 8px 24px rgba(0,0,0,0.15);  
    }  

    .avatar-wrapper {  
        position: relative;  
        z-index: 1;  
        margin-bottom: 1.5rem;  
        cursor: pointer;  
    }  

    .bubble-chat {  
        position: absolute;  
        top: -30px;  
        left: 40%;  
        transform: translateX(-50%);  
        background: rgba(0, 0, 0, 0.6);  
        backdrop-filter: blur(12px);  
        -webkit-backdrop-filter: blur(12px);  
        border: 1px solid rgba(255, 255, 255, 0.15);  
        color: #ffffff;  
        padding: 8px 25px;  
        border-radius: 50px;  
        font-size: 13px;  
        font-weight: 700;  
        white-space: nowrap;  
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);  
        z-index: 10;  
        pointer-events: none;  
        font-family: var(--font-sans);  
        letter-spacing: 0.3px;  
    }  
    .bubble-chat::after {  
        content: '';  
        position: absolute;  
        bottom: -8px;  
        left: 35%;  
        transform: translateX(-50%);  
        border-left: 8px solid transparent;  
        border-right: 8px solid transparent;  
        border-top: 8px solid rgba(234, 226, 226, 0.6);  
    }  

    .avatar-ring {  
        width: 160px;  
        height: 160px;  
        border-radius: 50%;  
        position: relative;  
        background: rgba(0, 0, 0, 0.55);  
        backdrop-filter: blur(12px);  
        -webkit-backdrop-filter: blur(12px);  
        padding: 4px;  
    }  

    .avatar-ring::before {  
        content: '';  
        position: absolute;  
        inset: -18px;  
        background-image: url('assets/border.png');  
        background-size: contain;  
        background-position: center;  
        background-repeat: no-repeat;  
        pointer-events: none;  
        z-index: 2;  
        animation: spin 25s linear infinite;  
    }  
    @keyframes spin {  
        to { transform: rotate(360deg); }  
    }  

    .avatar-ring img {  
        width: 100%;  
        height: 100%;  
        object-fit: cover;  
        border-radius: 50%;  
        display: block;  
        border: 4px solid transparent;  
    }  

    .hero h1 {  
        font-family: var(--font-display);  
        font-size: clamp(1.8rem, 5vw, 2.5rem);  
        font-weight: 700;  
        color: #ffffff;  
        letter-spacing: -1.5px;  
        line-height: 1.15;  
        margin-bottom: 0.4rem;  
        display: flex;  
        align-items: center;  
        justify-content: center;  
        flex-wrap: wrap;  
        gap: 0.45rem 0.75rem;  
    }  

    .title-badge {  
        display: inline-block;  
        height: 1.5em;  
        width: auto;  
        object-fit: contain;  
        vertical-align: middle;  
        flex-shrink: 0;  
        pointer-events: none;  
        user-select: none;  
    }  

    .verified-badge {  
        display: inline-block;  
        width: 22px;  
        height: 22px;  
        object-fit: contain;  
        vertical-align: middle;  
        flex-shrink: 0;  
        pointer-events: none;  
        user-select: none;  
        margin-left: -4px;  
    }  

    .dev-stats-wrap {  
        position: relative;  
        width: 100%;  
        max-width: 100%;  
        margin: 1rem auto 1.2rem;  
        padding: 2px;  
        border-radius: calc(var(--radius-lg) + 2px);  
        overflow: hidden;  
        isolation: isolate;  
    }  

    .dev-stats-wrap::before {  
        content: '';  
        position: absolute;  
        top: 50%;  
        left: 50%;  
        width: 200%;  
        aspect-ratio: 1 / 1;  
        transform: translate(-50%, -50%);  
        background: conic-gradient(  
            from 0deg,  
            rgba(255, 255, 255, 0)    0deg,  
            rgba(255, 255, 255, 0.12) 35deg,  
            rgba(255, 255, 255, 0.85) 70deg,  
            rgba(255, 255, 255, 1)    85deg,  
            rgba(255, 255, 255, 0.12) 120deg,  
            rgba(255, 255, 255, 0)    155deg,  
            rgba(255, 255, 255, 0)    180deg,  
            rgba(255, 255, 255, 0.12) 215deg,  
            rgba(255, 255, 255, 0.85) 250deg,  
            rgba(255, 255, 255, 1)    265deg,  
            rgba(255, 255, 255, 0.12) 300deg,  
            rgba(255, 255, 255, 0)    335deg,  
            rgba(255, 255, 255, 0)    360deg  
        );  
        animation: borderSpin 4.5s linear infinite;  
        z-index: 0;  
        pointer-events: none;  
    }  

    @keyframes borderSpin {  
        from { transform: translate(-50%, -50%) rotate(0deg); }  
        to   { transform: translate(-50%, -50%) rotate(360deg); }  
    }  

    .dev-stats {  
        position: relative;  
        z-index: 1;  
        display: flex;  
        flex-direction: column;  
        align-items: stretch;  
        width: 100%;  
        background: linear-gradient(180deg, rgba(16, 16, 24, 0.94), rgba(8, 8, 14, 0.94));  
        border-radius: var(--radius-lg);  
        backdrop-filter: blur(16px);  
        -webkit-backdrop-filter: blur(16px);  
        overflow: hidden;  
    }  

    .dev-tagline {  
        display: flex;  
        align-items: center;  
        justify-content: center;  
        width: 100%;  
        padding: 0.9rem 1.25rem;  
        background: rgba(255, 255, 255, 0.035);  
        border-bottom: 1px solid var(--line);  
    }  
    .dev-tagline .tagline {  
        font-family: var(--font-sans);  
        font-size: 1rem;  
        font-weight: 500;  
        color: var(--text-1);  
        letter-spacing: 0.4px;  
        line-height: 1.5;  
        margin: 0;  
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);  
    }  

    .dev-stats-row {  
        display: flex;  
        align-items: stretch;  
        justify-content: center;  
        width: 100%;  
        border-bottom: 1px solid #9e9e9e4d;  
    }  

    .dev-stat-item {  
        display: flex;  
        flex-direction: column;  
        align-items: center;  
        justify-content: center;  
        padding: 1.25rem 1.5rem;  
        flex: 1;  
        position: relative;  
    }  
    .dev-stat-item + .dev-stat-item::before {  
        content: '';  
        position: absolute;  
        left: 0;  
        top: 22%;  
        bottom: 22%;  
        width: 1px;  
        background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.3), transparent);  
    }  
    .dev-stat-value {  
        font-family: var(--font-display);  
        font-size: 1.8rem;  
        font-weight: 700;  
        letter-spacing: -0.5px;  
        line-height: 1.1;  
        color: #ffffff;  
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);  
    }  
    .dev-stat-label {  
        font-size: 0.85rem;  
        font-weight: 600;  
        letter-spacing: 1.3px;  
        color: var(--text-1);  
        margin-top: 0.3rem;  
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);  
    }  

    .social-section {  
        position: relative;  
        width: 100%;  
        padding: 1.5rem 1.5rem 1.75rem;  
        background-image:  
            linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.55) 100%),  
            url('assets/bgs.jpg');  
        background-size: cover;  
        background-position: center;  
        background-repeat: no-repeat;  
    }  

    .social-card-title {  
        display: flex;  
        align-items: center;  
        gap: 0.6rem;  
        font-family: var(--font-display);  
        font-size: 1.05rem;  
        font-weight: 700;  
        letter-spacing: 1.6px;  
        text-transform: uppercase;  
        color: #ffffff;  
        margin-bottom: 1.15rem;  
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);  
    }  

    .social-card-title::after {  
        content: '';  
        flex: 1;  
        height: 1px;  
        margin-left: 0.35rem;  
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.28), transparent);  
    }  

    .social-links {  
        display: flex;  
        flex-direction: column;  
        gap: 0.7rem;  
    }  

    .social-link {  
        --brand: #ffffff;  
        --brand-rgb: 255, 255, 255;  
        position: relative;  
        display: flex;  
        align-items: center;  
        justify-content: space-between;  
        gap: 0.75rem;  
        padding: 0.7rem 0.8rem 0.7rem 1.1rem;  
        border-radius: 14px;  
        background: rgba(0, 0, 0, 0.34);  
        border: 1px solid rgba(255, 255, 255, 0.1);  
        backdrop-filter: blur(10px);  
        -webkit-backdrop-filter: blur(10px);  
        overflow: hidden;  
        isolation: isolate;  
    }  

    .social-link::before {  
        content: '';  
        position: absolute;  
        left: 0;  
        top: 12%;  
        bottom: 12%;  
        width: 3px;  
        border-radius: 0 3px 3px 0;  
        background: var(--brand);  
        opacity: 0.5;  
    }  

    .social-link:hover {  
        background: rgba(0, 0, 0, 0.5);  
        border-color: rgba(var(--brand-rgb), 0.5);  
    }  

    .social-link:hover::before {  
        opacity: 1;  
        top: 0;  
        bottom: 0;  
    }  

    .social-link-left {  
        display: flex;  
        align-items: center;  
        gap: 0.85rem;  
        min-width: 0;  
        flex: 1;  
    }  

    .social-logo {  
        display: inline-flex;  
        align-items: center;  
        justify-content: center;  
        flex-shrink: 0;  
        width: 36px;  
        height: 36px;  
        border-radius: 11px;  
        background: rgba(var(--brand-rgb), 0.13);  
        border: 1px solid rgba(var(--brand-rgb), 0.24);  
        color: var(--brand);  
    }  

    .social-link:hover .social-logo {  
        background: rgba(var(--brand-rgb), 0.25);  
        border-color: rgba(var(--brand-rgb), 0.55);  
    }  

    .social-logo svg {  
        width: 18px;  
        height: 18px;  
        fill: currentColor;  
        display: block;  
    }  

    .social-meta {  
        display: flex;  
        flex-direction: column;  
        min-width: 0;  
        line-height: 1.25;  
        text-align: left;  
    }  

    .social-name {  
        font-size: 0.63rem;  
        font-weight: 800;  
        letter-spacing: 1.4px;  
        color: var(--brand);  
        opacity: 0.9;  
    }  

    .social-handle {  
        font-size: 0.93rem;  
        font-weight: 600;  
        color: #ffffff;  
        letter-spacing: 0.1px;  
        white-space: nowrap;  
        overflow: hidden;  
        text-overflow: ellipsis;  
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.75);  
    }  

    .github-color   { --brand: #f0f6fc; --brand-rgb: 240, 246, 252; }  
    .telegram-color { --brand: #2aabee; --brand-rgb: 42, 171, 238; }  
    .whatsapp-color { --brand: #25d366; --brand-rgb: 37, 211, 102; }  

    .copy-btn {  
        position: relative;  
        display: flex;  
        align-items: center;  
        justify-content: center;  
        flex-shrink: 0;  
        width: 38px;  
        height: 38px;  
        border-radius: 11px;  
        background: rgba(255, 255, 255, 0.06);  
        border: 1px solid rgba(255, 255, 255, 0.1);  
        color: rgba(255, 255, 255, 0.62);  
        cursor: pointer;  
    }  

    .copy-btn svg {  
        width: 18px;  
        height: 18px;  
        fill: currentColor;  
        display: block;  
    }  

    .copy-btn:hover {  
        color: #ffffff;  
        background: rgba(var(--brand-rgb), 0.18);  
        border-color: rgba(var(--brand-rgb), 0.45);  
    }  

    .copy-btn:active {  
        transform: scale(0.92);  
    }  

    .copy-btn.copied {  
        color: #4ade80;  
        background: rgba(74, 222, 128, 0.14);  
        border-color: rgba(74, 222, 128, 0.5);  
    }  

    .copy-btn.copied:hover {  
        color: #4ade80;  
        background: rgba(74, 222, 128, 0.2);  
    }  

    .toast {  
        position: fixed;  
        left: 50%;  
        bottom: 32px;  
        transform: translate(-50%, 24px);  
        display: flex;  
        align-items: center;  
        gap: 0.55rem;  
        padding: 0.72rem 1.2rem;  
        border-radius: 999px;  
        background: rgba(12, 12, 18, 0.94);  
        backdrop-filter: blur(16px);  
        -webkit-backdrop-filter: blur(16px);  
        border: 1px solid rgba(255, 255, 255, 0.16);  
        box-shadow: 0 18px 44px -14px rgba(0, 0, 0, 0.9),  
                    0 0 0 1px rgba(255, 255, 255, 0.04) inset;  
        color: #ffffff;  
        font-family: var(--font-sans);  
        font-size: 0.85rem;  
        font-weight: 600;  
        letter-spacing: 0.2px;  
        white-space: nowrap;  
        opacity: 0;  
        pointer-events: none;  
        z-index: 999;  
    }  

    .toast.show {  
        opacity: 1;  
        transform: translate(-50%, 0);  
    }  

    .toast svg {  
        width: 16px;  
        height: 16px;  
        fill: #4ade80;  
        flex-shrink: 0;  
    }  

    @media (prefers-reduced-motion: reduce) {  
        .dev-stats-wrap::before,  
        .avatar-ring::before {  
            animation: none !important;  
        }  
    }  

    @media (max-width: 768px) {  
        .container { padding: 1rem 1rem 2rem; }  
        .hero h1 { font-size: 1.6rem; gap: 0.4rem 0.6rem; }  
        .title-badge { height: 1.35em; }  
        .verified-badge { width: 19px; height: 19px; }  
        .avatar-ring { width: 140px; height: 140px; }  
        .avatar-ring::before { inset: -14px; }  
        .hero-banner { margin-bottom: -75px; }  
        .dev-tagline { padding: 0.7rem 1rem; }  
        .dev-tagline .tagline { font-size: 0.88rem; }  
        .dev-stat-item { padding: 1rem 1rem; }  
        .dev-stat-value { font-size: 1.45rem; }  
        .dev-stat-label { font-size: 0.8rem; letter-spacing: 1px; }  
        .social-section { padding: 1.2rem 1.1rem 1.4rem; }  
        .social-card-title { font-size: 0.95rem; letter-spacing: 1.3px; margin-bottom: 1rem; }  
        .social-link { padding: 0.65rem 0.7rem 0.65rem 0.95rem; border-radius: 13px; }  
        .social-logo { width: 32px; height: 32px; border-radius: 10px; }  
        .social-logo svg { width: 16px; height: 16px; }  
        .social-name { font-size: 0.58rem; letter-spacing: 1.2px; }  
        .social-handle { font-size: 0.85rem; }  
        .copy-btn { width: 34px; height: 34px; border-radius: 10px; }  
        .copy-btn svg { width: 16px; height: 16px; }  
        .bubble-chat { top: -28px; font-size: 11px; padding: 8px 25px; }  
        .bubble-chat::after {  
            border-left-width: 6px;  
            border-right-width: 6px;  
            border-top-width: 6px;  
            bottom: -6px;  
        }  
    }  

    @media (max-width: 480px) {  
        .hero h1 { font-size: 1.4rem; gap: 0.35rem 0.5rem; }  
        .title-badge { height: 1.2em; }  
        .verified-badge { width: 17px; height: 17px; }  
        .avatar-ring { width: 120px; height: 120px; }  
        .avatar-ring::before { inset: -12px; }  
        .hero-banner { margin-bottom: -65px; }  
        .dev-tagline { padding: 0.6rem 0.8rem; }  
        .dev-tagline .tagline { font-size: 0.78rem; letter-spacing: 0.2px; }  
        .dev-stat-item { padding: 0.85rem 0.6rem; }  
        .dev-stat-value { font-size: 1.2rem; }  
        .dev-stat-label { font-size: 0.72rem; letter-spacing: 0.7px; }  
        .social-section { padding: 1rem 0.85rem 1.2rem; }  
        .social-card-title { font-size: 0.85rem; letter-spacing: 1.1px; margin-bottom: 0.85rem; }  
        .social-links { gap: 0.55rem; }  
        .social-link { padding: 0.55rem 0.6rem 0.55rem 0.8rem; border-radius: 12px; }  
        .social-link-left { gap: 0.65rem; }  
        .social-logo { width: 29px; height: 29px; border-radius: 9px; }  
        .social-logo svg { width: 14px; height: 14px; }  
        .social-name { font-size: 0.53rem; letter-spacing: 1px; }  
        .social-handle { font-size: 0.78rem; }  
        .copy-btn { width: 31px; height: 31px; border-radius: 9px; }  
        .copy-btn svg { width: 15px; height: 15px; }  
        .toast { bottom: 20px; font-size: 0.78rem; padding: 0.62rem 1rem; }  
        .bubble-chat { top: -24px; font-size: 10px; padding: 8px 25px; }  
        .bubble-chat::after {  
            border-left-width: 5px;  
            border-right-width: 5px;  
            border-top-width: 5px;  
            bottom: -5px;  
        }  
    }  
</style>

</head>  
<body>  <div class="container">  
    <header class="hero">  
        <img src="https://i.pinimg.com/1200x/46/25/dc/4625dc650f686ba9ddb7d24df89cd411.jpg" alt="Banner" class="hero-banner">  

        <div class="avatar-wrapper" id="avatarWrapper" title="Foto Profil">  
            <div class="bubble-chat">I'm a Developer</div>  
            <div class="avatar-ring">
